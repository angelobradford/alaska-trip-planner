<title>Bradford Family Kitchen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: phone-first app shell. One column of working cards, a fixed tab bar at the bottom, sheets slide up for detail. */
:root{
  --bg:#eef2ec;        /* rinsed-greens neutral */
  --surface:#fbfcf9;
  --ink:#1c2620;
  --muted:#5d6b62;
  --line:#d5ddd4;
  --accent:#1f6b4a;    /* basil */
  --accent-ink:#ffffff;
  --accent-soft:#d9eadf;
  --potato:#9a6331;    --potato-soft:#f1e3d2;
  --rice:#4f6577;      --rice-soft:#dfe7ee;
  --pasta:#b0452c;     --pasta-soft:#f6ddd5;
  --grain:#8a7a1e;     --grain-soft:#efe9c8;
  --warn:#a3361f;      --warn-soft:#f8e0d9;
  --star:#c98a0b;
  --shadow:0 1px 2px rgba(28,38,32,.06),0 6px 20px rgba(28,38,32,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815;--surface:#1b231f;--ink:#e6ede7;--muted:#9aaa9f;--line:#2e3a33;
  --accent:#5cc28f;--accent-ink:#0d1a13;--accent-soft:#1f3a2c;
  --potato:#e0a46a;--potato-soft:#3a2a1b;--rice:#9db7cc;--rice-soft:#222f39;
  --pasta:#f08a6f;--pasta-soft:#3d231c;--grain:#d8c55a;--grain-soft:#35311a;
  --warn:#f29a83;--warn-soft:#3d221b;--star:#f0b742;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815;--surface:#1b231f;--ink:#e6ede7;--muted:#9aaa9f;--line:#2e3a33;
  --accent:#5cc28f;--accent-ink:#0d1a13;--accent-soft:#1f3a2c;
  --potato:#e0a46a;--potato-soft:#3a2a1b;--rice:#9db7cc;--rice-soft:#222f39;
  --pasta:#f08a6f;--pasta-soft:#3d231c;--grain:#d8c55a;--grain-soft:#35311a;
  --warn:#f29a83;--warn-soft:#3d221b;--star:#f0b742;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 24px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.65rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:800}
h3{font-size:1.02rem;font-weight:600}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:20px 12px}
.status{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.dot.off{background:var(--potato)}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.card h2{margin-bottom:2px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.92rem;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--warn);border-color:var(--warn-soft)}
.btn.confirm{background:var(--warn);border-color:var(--warn);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex:none}
.icon-btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.icon-btn svg,.btn svg,.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.chip.potato{background:var(--potato-soft);color:var(--potato)}
.chip.rice{background:var(--rice-soft);color:var(--rice)}
.chip.pasta{background:var(--pasta-soft);color:var(--pasta)}
.chip.grain{background:var(--grain-soft);color:var(--grain)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* Summary strip */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.76rem;color:var(--muted)}
.mixbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line);margin-top:8px}
.mixbar i{display:block;height:100%}

/* Week */
.day{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day .dname{font-family:var(--f-display);font-weight:800;font-size:1rem;line-height:1}
.day .ddate{font-size:.74rem;color:var(--muted)}
.day.today .dname{color:var(--accent)}
.meal-name{background:none;border:0;padding:0;text-align:left;font-weight:700;font-size:1rem;color:var(--ink)}
.meal-name:hover{text-decoration:underline}
.day .acts{display:flex;gap:6px}
.slotlabel{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.skipped{color:var(--muted);font-style:italic}

.preplist{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.preplist li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.preplist input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}

/* Shop */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:700;font-size:.85rem;min-height:36px}
.seg button.on-need{background:var(--accent);color:var(--accent-ink)}
.seg button.on-have{background:var(--line)}
.pantry-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.pantry-row:first-of-type{border-top:0}
.sect{margin-top:4px}
.sect h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:10px 0 4px;font-family:var(--f-body);font-weight:700}
.item{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.item .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.item.done .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item .box svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3}
.item.done .iname{text-decoration:line-through;color:var(--muted)}
.iname{font-weight:700;overflow-wrap:anywhere}
.isrc{font-size:.76rem;color:var(--muted);overflow-wrap:anywhere}
.qty{display:flex;align-items:center;gap:2px}
.qty button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:800;line-height:1}
.storesel{min-height:0;width:auto;padding:1px 6px;font-size:.76rem;border-radius:999px;margin-right:2px;color:var(--accent);font-weight:700;background:var(--accent-soft);border-color:transparent}
.qty .q{min-width:68px;text-align:center;font-size:.9rem;font-weight:700;font-variant-numeric:tabular-nums}
.star{color:var(--star)}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;font-weight:700;color:var(--muted)}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-height:42px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:440px){.grid4{grid-template-columns:repeat(2,1fr)}.summary{grid-template-columns:repeat(3,1fr)}.stat b{font-size:1.2rem}}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:4px;background:var(--surface)}
.stepper button{width:34px;height:34px;border-radius:9px;border:0;background:var(--bg);font-weight:800;font-size:1.1rem}
.stepper b{font-variant-numeric:tabular-nums;font-size:1.05rem}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.tag-in{display:flex;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:.85rem;padding:4px 6px 4px 10px;border-radius:999px}
.tag button{border:0;background:transparent;color:inherit;width:22px;height:22px;border-radius:50%;padding:0;font-weight:800}

.staple{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.staple:first-of-type{border-top:0}

/* Recipes */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.85rem;white-space:nowrap;min-height:36px}
.filters button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;text-align:left}
.rcard.blocked{opacity:.62}
.rmeta{font-size:.8rem;color:var(--muted)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,12,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:18px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.sheet ol,.sheet ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.ing{display:grid;grid-template-columns:92px 1fr;gap:8px;padding:5px 0;border-top:1px dashed var(--line)}
.ing:first-child{border-top:0}
.ing .amt{font-weight:700;font-variant-numeric:tabular-nums}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:.74rem;font-weight:700;color:var(--muted);min-height:52px;position:relative}
.tab.on{color:var(--accent);background:var(--accent-soft)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--accent);color:var(--accent-ink);font-size:.66rem;border-radius:999px;padding:0 6px;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:22px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
.note{background:var(--potato-soft);color:var(--potato);border-radius:12px;padding:10px 12px;font-size:.88rem;font-weight:700}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="hdr-eyebrow">Family of 7 · high protein · potato first</div>

</div>

</nav>

function clone(o){return o==null?o:JSON.parse(JSON.stringify(o))}
function emptyTrip(){return {need:{},have:{},checked:{},qty:{},extras:[],keep:{},bought:{}}}
function uid(){return Math.random().toString(36).slice(2,10)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function norm(s){return String(s).toLowerCase().replace(/\(.*?\)/g,"").replace(/\s+/g," ").trim()}

/* ===================== Store: shared db when available, this device otherwise ===================== */
const LSKEY = "family-kitchen.v1";
const Store = {
  mode:"loading", db:null, timers:{}, chains:{}, pend:{},
  async init(){
    if(!(window.claude && typeof window.claude.use==="function")) return this.local();
    let db=null; try{ db = await window.claude.use("db"); }catch(e){}
    if(!db) return this.local();
    this.db=db; this.mode="db"; setStatus();
    const slow = setTimeout(()=>{ if(!allReady()){ this.slow=true; setStatus(); }},10000);
    const done = ()=>{ if(allReady()){ clearTimeout(slow); this.slow=false; setStatus(); } };
    const onErr = e=>{ clearTimeout(slow); this.err=e&&e.code||"unavailable"; setStatus(); };
    [["household/settings","settings"],["household/plan","plan"],["household/trip","trip"],["household/prep","prep"]].forEach(([path,key])=>{
      db.doc(path).onSnapshot(snap=>{
        if(this.pend[path]) return;
        applyLocal(path, snap.exists ? clone(snap.data()) : null);
        if(!snap.metadata.fromCache){ ready[key]=true; done(); }
        render();
      }, onErr);
    });
    ["staples","recipes"].forEach(col=>{
      db.collection(col).onSnapshot(qs=>{
        const m={};
        qs.docs.forEach(d=>{ if(d.exists) m[d.id]=clone(d.data()); });
        Object.keys(this.pend).forEach(p=>{ if(this.pend[p] && p.startsWith(col+"/")){ const id=p.slice(col.length+1); if(S[col][id]) m[id]=S[col][id]; else delete m[id]; }});
        S[col]=m;
        if(!qs.metadata.fromCache){ ready[col]=true; done(); }
        render();
      }, onErr);
    });
  },
  local(){
    this.mode="local";
    try{ const raw=localStorage.getItem(LSKEY); if(raw){ const d=JSON.parse(raw);
      if(d.settings) S.settings={...clone(DEF_SETTINGS),...d.settings};
      S.plan=d.plan||null; S.trip={...emptyTrip(),...(d.trip||{})}; S.staples=d.staples||{}; S.recipes=d.recipes||{}; S.prep=d.prep||{};
    }}catch(e){}
    Object.keys(ready).forEach(k=>ready[k]=true);
    setStatus(); render();
  },
  put(path,data){ applyLocal(path,data); render(); this.schedule(path); },
  schedule(path){
    if(this.mode==="local"){
      clearTimeout(this.timers.__ls);
      this.timers.__ls=setTimeout(()=>{ try{ localStorage.setItem(LSKEY,JSON.stringify({settings:S.settings,plan:S.plan,trip:S.trip,staples:S.staples,recipes:S.recipes,prep:S.prep})); }catch(e){ toast("This browser won't save. Changes last until you close the page."); } },300);
      return;
    }
    if(this.mode!=="db") return;
    this.pend[path]=(this.pend[path]||0)+1;
    clearTimeout(this.timers[path]);
    this.timers[path]=setTimeout(()=>{
      delete this.timers[path];
      const data=currentDoc(path);
      this.chains[path]=(this.chains[path]||Promise.resolve())
        .then(()=> data ? this.db.doc(path).set(data) : this.db.doc(path).delete())
        .catch(e=>{ toast(e&&e.code==="quota_exceeded" ? "Storage is full. Delete some old staples or recipes." : "Couldn't save that change. Check your connection and try again."); })
        .finally(()=>{ this.pend[path]=0; });
    },500);
  }
};
function allReady(){return Object.values(ready).every(Boolean)}
function applyLocal(path,data){
  const [a,b]=path.split("/");
  if(a==="household"){
    if(b==="settings") S.settings = data ? {...clone(DEF_SETTINGS),...data,mix:{...DEF_SETTINGS.mix,...(data.mix||{})}} : clone(DEF_SETTINGS);
    if(b==="plan") S.plan = data;
    if(b==="trip") S.trip = {...emptyTrip(),...(data||{})};
    if(b==="prep") S.prep = data||{};
  } else if(a==="staples"||a==="recipes"){
    if(data) S[a][b]=data; else delete S[a][b];
  }
}
function currentDoc(path){
  const [a,b]=path.split("/");
  if(a==="household") return clone(b==="settings"?S.settings:b==="plan"?S.plan:b==="trip"?S.trip:S.prep);
  return clone(S[a][b]||null);
}
const save = {
  settings(){Store.put("household/settings",clone(S.settings))},
  plan(){Store.put("household/plan",clone(S.plan))},
  trip(){Store.put("household/trip",clone(S.trip))},
  prep(){Store.put("household/prep",clone(S.prep))},
  staple(id,d){Store.put("staples/"+id,d)},
  recipe(id,d){Store.put("recipes/"+id,d)}
};

/* ===================== Recipe helpers ===================== */
function allRecipes(){ return [...LIB, ...Object.entries(S.recipes).map(([id,r])=>({...r,id,custom:true}))]; }
function recipe(id){ return allRecipes().find(r=>r.id===id); }
function ingCount(r){ return r.i.filter(x=>x[3]!=="X").length; }
function avoidHits(r){
  const av=(S.settings.avoid||[]).map(norm).filter(Boolean);
  const hits=[]; r.i.forEach(x=>{ const n=norm(x[2]); av.forEach(a=>{ if(n.includes(a)||norm(r.n).includes(a)) if(!hits.includes(a)) hits.push(a); }); });
  return hits;
}
function eligible(r,meal){
  const st=S.settings;
  if(r.m!==meal) return false;
  if((st.hidden||[]).includes(r.id)) return false;
  if(avoidHits(r).length) return false;
  if(ingCount(r)>st.maxIng) return false;
  if(r.a>st.maxActive) return false;
  return true;
}
function scale(){ return (S.settings.servings||8)/4; }

/* ===================== Stores ===================== */
function stores(){ return S.settings.stores||[]; }
function validStore(id){ return id && stores().some(s=>s.id===id) ? id : null; }
function storeName(id){ const s=stores().find(x=>x.id===id); return s?s.name:"Any store"; }
function defaultStore(){ return validStore(S.settings.defStore) || (stores()[0]&&stores()[0].id) || ""; }
function storeOf(name,stapleId,extra){
  return validStore(stapleId&&S.staples[stapleId]&&S.staples[stapleId].store) || validStore(extra&&extra.store)
    || validStore((S.settings.itemStore||{})[norm(name)]) || defaultStore();
}
function storeSelect(attrs,cur){ return `<select ${attrs}>${stores().map(s=>`<option value="${esc(s.id)}" ${s.id===cur?"selected":""}>${esc(s.name)}</option>`).join("")}</select>`; }

/* ===================== Dates ===================== */
function weekStart(d=new Date(), start=S.settings.start){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const diff=(x.getDay()-start+7)%7; x.setDate(x.getDate()-diff); return x; }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fromIso(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtDate(d){ return MONTHS[d.getMonth()]+" "+d.getDate(); }

/* ===================== Planning ===================== */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickFrom(pool, used){
  const fav=S.settings.fav||[];
  let c=pool.filter(r=>!used.has(r.id)); if(!c.length) c=pool.slice();
  if(!c.length) return null;
  const bag=[]; c.forEach(r=>{ const w=fav.includes(r.id)?3:1; for(let k=0;k<w;k++) bag.push(r); });
  return bag[Math.floor(Math.random()*bag.length)];
}
function makePlan(keep){
  const ws = weekStart();
  const old = keep && S.plan ? S.plan : null;
  const dinners = old ? clone(old.dinner) : Array.from({length:7},()=>({r:null,lock:false,skip:false}));
  const bfast = old && old.breakfast ? clone(old.breakfast) : Array.from({length:7},()=>({r:null,lock:false,skip:false}));
  const pool = allRecipes().filter(r=>eligible(r,"dinner"));
  // Build starch slots from the weekly mix, potato filling any leftover nights.
  const open = dinners.map((d,i)=>i).filter(i=>!dinners[i].lock && !dinners[i].skip);
  const lockedCount = {}; dinners.forEach(d=>{ if((d.lock||d.skip)&&d.r){ const r=recipe(d.r); if(r) lockedCount[r.s]=(lockedCount[r.s]||0)+1; }});
  const slots=[];
  Object.entries(S.settings.mix).forEach(([s,n])=>{ for(let k=(lockedCount[s]||0);k<n;k++) slots.push(s); });
  while(slots.length<open.length) slots.push("potato");
  shuffle(slots);
  const used=new Set(dinners.filter(d=>d.lock&&d.r).map(d=>d.r));
  open.forEach((i,k)=>{
    const s=slots[k]; let p=pool.filter(r=>r.s===s); if(!p.length) p=pool;
    const r=pickFrom(p,used); dinners[i]={r:r?r.id:null,lock:false,skip:false}; if(r) used.add(r.id);
  });
  const bpool = allRecipes().filter(r=>eligible(r,"breakfast"));
  const bused=new Set();
  bfast.forEach((b,i)=>{ if(b.lock||b.skip) return; const r=pickFrom(bpool,bused); bfast[i]={r:r?r.id:null,lock:false,skip:false}; if(r){ bused.add(r.id); if(bused.size>=bpool.length) bused.clear(); }});
  S.plan={weekOf:iso(ws),dinner:dinners,breakfast:bfast};
  S.prep={};
  if(!keep && S.trip.bought && Object.keys(S.trip.bought).length){ S.trip.bought={}; save.trip(); }
  save.plan(); save.prep();
}
function swap(meal,i){
  const used=new Set(S.plan[meal].map(d=>d.r));
  const cur=S.plan[meal][i]; const curR=recipe(cur.r);
  const pool=allRecipes().filter(r=>eligible(r,meal) && r.id!==cur.r);
  let p = meal==="dinner" && curR ? pool.filter(r=>r.s===curR.s) : pool;
  if(!p.length) p=pool;
  const r=pickFrom(p,used); if(!r){ toast("No other recipes fit your Household rules."); return; }
  S.plan[meal][i]={r:r.id,lock:false,skip:false}; save.plan();
}

/* ===================== Grocery list ===================== */
function niceQty(q,unit){
  if(unit==="dozen") return Math.ceil(q*2)/2;
  if(WHOLE_UNITS.has(unit)) return Math.max(1,Math.ceil(q-0.05));
  if(unit==="lb") return Math.ceil(q*4)/4;
  if(unit==="cup") return Math.ceil(q*4)/4;
  return Math.round(q*100)/100;
}
function fmtQty(q){
  const w=Math.floor(q), f=Math.round((q-w)*100)/100;
  const fr={0.25:"¼",0.5:"½",0.75:"¾",0.33:"⅓",0.67:"⅔"}[f];
  if(f===0) return String(w);
  if(fr) return (w?w:"")+fr;
  return String(Math.round(q*100)/100);
}
function unitLabel(u,q){ if(u==="each") return ""; if(u==="lb") return " lb"; if(q>1 && ["can","jar","bag","pkg","box","head","bunch","carton","tub","pint","loaf","bottle","roll"].includes(u)) return " "+(u==="box"?"boxes":u==="bunch"?"bunches":u+"s"); return " "+u; }
function keyOf(name,unit){ return norm(name)+"|"+unit; }

function planMeals(){
  if(!S.plan) return [];
  const ws=fromIso(S.plan.weekOf); const out=[];
  ["dinner","breakfast"].forEach(meal=>{
    if(meal==="breakfast" && !S.settings.breakfasts) return;
    (S.plan[meal]||[]).forEach((d,i)=>{ if(d.skip||!d.r) return; const r=recipe(d.r); if(r) out.push({meal,i,r,date:addDays(ws,i)}); });
  });
  return out;
}
function buildList(){
  const rows=new Map(); const basics=new Set();
  const add=(name,qty,unit,sec,src,extra)=>{
    if(name.toLowerCase().trim()==="eggs"&&unit==="each"){ qty=qty/12; unit="dozen"; }
    const k=keyOf(name,unit);
    let r=rows.get(k);
    if(!r){ r={key:k,name,unit,sec,qty:0,src:[],...extra}; rows.set(k,r); }
    else if(extra) Object.assign(r,extra);
    r.qty+=qty; if(src) r.src.push(src);
  };
  planMeals().forEach(({meal,r,date})=>{
    r.i.forEach(([q,u,name,sec])=>{
      if(sec==="X"){ basics.add(name); return; }
      add(name,q*scale(),u,sec,DAYN[date.getDay()]+(meal==="breakfast"?" breakfast":""));
    });
  });
  Object.entries(S.staples).forEach(([id,s])=>{
    const need = s.every ? !S.trip.have[id] : S.trip.need[id];
    if(!need) return;
    add(s.name,s.qty,s.unit,s.sec,"usually "+fmtQty(s.qty)+unitLabel(s.unit,s.qty),{stapleId:id,snack:!!s.snack});
  });
  (S.trip.extras||[]).forEach(x=>add(x.name,x.qty,x.unit,x.sec,"added",{extraId:x.id}));
  const bought=S.trip.bought||{};
  const all=[...rows.values()].map(r=>{
    const q = S.trip.qty[r.key]!=null ? S.trip.qty[r.key] : niceQty(r.qty,r.unit);
    const ex = r.extraId ? (S.trip.extras||[]).find(x=>x.id===r.extraId) : null;
    return {...r,qty:q,done:!!S.trip.checked[r.key],store:storeOf(r.name,r.stapleId,ex)};
  });
  const list=all.filter(r=>!bought[r.key]);
  return {list,basics:[...basics],boughtCount:all.length-list.length};
}
function finishTrip(store){
  const {list}=buildList();
  let remembered=0, added=0;
  const done=list.filter(x=>x.done && (store==="all"||x.store===store));
  done.forEach(x=>{
    if(x.stapleId && S.staples[x.stapleId]){
      const s=clone(S.staples[x.stapleId]);
      s.hist=[...(s.hist||[]),x.qty].slice(-6);
      const last=s.hist.slice(-4).sort((a,b)=>a-b); const med=last[Math.floor(last.length/2)];
      if(med!==s.qty){ s.qty=med; remembered++; }
      s.last=iso(new Date()); save.staple(x.stapleId,s);
    } else if(x.extraId && S.trip.keep[x.extraId]){
      const id=uid(); save.staple(id,{name:x.name,qty:x.qty,unit:x.unit,sec:x.sec,store:x.store,every:false,snack:false,hist:[x.qty],last:iso(new Date())}); added++;
    }
  });
  const t=clone(S.trip); t.bought=t.bought||{};
  const doneExtras=new Set();
  done.forEach(x=>{ t.bought[x.key]=1; delete t.checked[x.key]; delete t.qty[x.key];
    if(x.stapleId){ delete t.need[x.stapleId]; } if(x.extraId){ doneExtras.add(x.extraId); delete t.keep[x.extraId]; } });
  t.extras=(t.extras||[]).filter(x=>!doneExtras.has(x.id));
  S.trip=t; save.trip();
  toast((store==="all"?"Trip":storeName(store)+" trip")+" saved."+(remembered?" Updated "+remembered+" usual amount"+(remembered>1?"s":"")+".":"")+(added?" Added "+added+" new staple"+(added>1?"s":"")+".":""));
}

/* ===================== Parsing typed lines like "2 gal milk" ===================== */
const UNIT_ALIASES={gallon:"gal",gallons:"gal",gal:"gal",lb:"lb",lbs:"lb",pound:"lb",pounds:"lb",oz:"oz",dozen:"dozen",doz:"dozen",each:"each",ct:"each",
  can:"can",cans:"can",jar:"jar",jars:"jar",bag:"bag",bags:"bag",pkg:"pkg",pack:"pkg",packs:"pkg",package:"pkg",packages:"pkg",box:"box",boxes:"box",
  head:"head",heads:"head",bunch:"bunch",bunches:"bunch",carton:"carton",cartons:"carton",tub:"tub",tubs:"tub",loaf:"loaf",loaves:"loaf",
  bottle:"bottle",bottles:"bottle",roll:"roll",rolls:"roll",cup:"cup",cups:"cup",pint:"pint",pints:"pint"};
const SEC_WORDS=[["P",/potato|onion|pepper|broccoli|lettuce|romaine|apple|banana|berr|grape|orange|clementine|lemon|lime|garlic|carrot|cucumber|tomato|spinach|avocado|asparagus|bean sprout|green bean|cabbage|slaw|celery|zucchini|squash|kale|fruit|melon|pear|peach/],
 ["M",/chicken|beef|steak|pork|turkey|sausage|bacon|ham|salmon|fish|shrimp|tuna steak|jerky stick|deli|roast|ground/],
 ["D",/milk|cheese|yogurt|egg|butter|cream|cottage|kefir/],
 ["F",/frozen|ice cream|waffle/],["B",/bread|tortilla|bun|bagel|roll|english muffin|pita/],
 ["S",/chip|cracker|pretzel|popcorn|bar|jerky|beef stick|hummus|nut|almond|cashew|pistachio|trail mix|seaweed|raisin|applesauce|fruit cup/],
 ["H",/paper|towel|soap|detergent|trash|wipe|foil|plastic wrap|diaper|toilet|napkin|sponge/]];
function guessSec(name){ const n=name.toLowerCase(); for(const [k,re] of SEC_WORDS) if(re.test(n)) return k; return "G"; }
function parseLine(line){
  let s=line.trim().replace(/^[-*•☐\[\] ]+/,""); if(!s) return null;
  let qty=1, unit="each";
  const m=s.match(/^(\d+(?:\.\d+)?|\d+\/\d+|½|¼|¾)\s*(.*)$/);
  if(m){ const t=m[1]; qty = t==="½"?0.5:t==="¼"?0.25:t==="¾"?0.75:t.includes("/")?(+t.split("/")[0]/+t.split("/")[1]):parseFloat(t); s=m[2]; }
  const w=s.split(/\s+/); const u=UNIT_ALIASES[(w[0]||"").toLowerCase().replace(/\.$/,"")];
  if(u && w.length>1){ unit=u; s=w.slice(1).join(" "); }
  s=s.replace(/^of\s+/i,"");
  const name=s.charAt(0).toUpperCase()+s.slice(1);
  return {name,qty:qty||1,unit,sec:guessSec(name)};
}

function fmtTime(r){ const tot = r.t>=120 ? Math.round(r.t/60)+" hr total" : r.t+" min total"; return r.a+" min hands-on · "+tot; }

}

function viewRecipes(){
  const fs=[["all","All"],["potato","Potato"],["rice","Rice"],["pasta","Pasta"],["grain","Grain"],["breakfast","Breakfast"],["fav","Favorites"]];
  let rs=allRecipes();
  const f=ui.filter;
  rs=rs.filter(r=> f==="all"?r.m==="dinner": f==="breakfast"?r.m==="breakfast": f==="fav"?(S.settings.fav||[]).includes(r.id): (r.m==="dinner"&&r.s===f));
  if(ui.q) rs=rs.filter(r=>norm(r.n+" "+r.i.map(x=>x[2]).join(" ")).includes(norm(ui.q)));
  const cards=rs.map(r=>{ const hits=avoidHits(r); const fav=(S.settings.fav||[]).includes(r.id); const hid=(S.settings.hidden||[]).includes(r.id);
    const tooMany=ingCount(r)>S.settings.maxIng, tooLong=r.a>S.settings.maxActive;

      <div class="chips">${chipStarch(r.s)}<span class="chip">${ingCount(r)} ingredients</span><span class="chip">${r.p} g protein</span>${r.custom?'<span class="chip ok">Ours</span>':""}</div>

  return `<div class="row wrap"><input type="text" id="rq" placeholder="Search recipes or ingredients" value="${esc(ui.q)}" class="grow" style="flex:1 1 200px"><button class="btn primary" data-act="newrecipe">${ICON.plus} Add our recipe</button></div>

  <div class="rgrid">${cards||'<div class="card empty"><p class="muted">No recipes match.</p></div>'}</div>`;
}

function closeSheet(){ document.getElementById("sheet-root").innerHTML=""; }
function openRecipe(id,meal,i){
  const r=recipe(id); if(!r) return;
  const hits=avoidHits(r); const hid=(S.settings.hidden||[]).includes(r.id);
  const sc=scale();
  const ing=r.i.map(([q,u,n,sec])=>{ const qq=sec==="X"?q*sc:niceQty(q*sc,u); return `<div class="ing"><span class="amt">${fmtQty(Math.round(qq*100)/100)}${unitLabel(u,qq)}</span><span>${esc(n)}${sec==="X"?' <span class="small muted">(basics)</span>':""}</span></div>`;}).join("");
  const ws=S.plan?fromIso(S.plan.weekOf):weekStart();
  document.getElementById("sheet-root").innerHTML=`<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(r.n)}">
    <div class="row between" style="align-items:flex-start"><div class="grow"><span class="eyebrow">${esc(r.how)} · serves ${S.settings.servings}</span><h2 style="font-size:1.4rem">${esc(r.n)}</h2></div><button class="icon-btn" data-act="close" aria-label="Close">×</button></div>
    <div class="chips">${chipStarch(r.s)}<span class="chip">${fmtTime(r)}</span><span class="chip">${r.p} g protein / serving</span><span class="chip">${ingCount(r)} ingredients</span></div>
    ${hits.length?`<div class="note">Contains something the kids skip: ${esc(hits.join(", "))}</div>`:""}
    <div><h3>Shopping amounts</h3><div style="margin-top:6px">${ing}</div></div>
    <div><h3>Steps</h3><ol style="margin-top:6px">${r.st.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>
    ${r.pre?`<div><h3>Prep ahead</h3><p style="margin:4px 0 0">${esc(r.pre)}</p></div>`:""}
    <div class="field"><label for="puton">Put on the plan</label>
      <div class="row"><select id="puton">${Array.from({length:7},(_,k)=>`<option value="${k}" ${k==i?"selected":""}>${DAYN[addDays(ws,k).getDay()]} ${fmtDate(addDays(ws,k))}</option>`).join("")}</select>
      <button class="btn primary" data-act="puton" data-id="${r.id}" data-meal="${r.m}" ${S.plan?"":"disabled"}>Use</button></div>
      ${S.plan?"":'<span class="small muted">Plan a week first.</span>'}</div>

      ${r.custom?`<button class="btn ${ui.armed==="delr:"+r.id?"confirm":"danger"}" data-act="delrecipe" data-id="${r.id}">${ui.armed==="delr:"+r.id?"Tap again to delete":"Delete recipe"}</button>`:""}</div>

/* ===================== Events ===================== */
document.querySelector("nav.tabs").addEventListener("click",e=>{ const b=e.target.closest(".tab"); if(!b) return; tab=b.dataset.tab; ui.armed=null; render(); window.scrollTo(0,0); });

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act;
  if(act==="close"){ if(e.target===el || el.tagName==="BUTTON") closeSheet(); return; }
  if(el.tagName==="INPUT"||el.tagName==="SELECT") return;
  const id=el.dataset.id, meal=el.dataset.meal, i=+el.dataset.i;
  const armedBefore=ui.armed; if(!["finish","fresh","delstaple","delrecipe","delstore"].includes(act)) ui.armed=null;
  switch(act){
    case "plan": makePlan(false); break;
    case "replan": makePlan(true); toast("Replanned the unlocked days."); break;
    case "swap": swap(meal,i); break;
    case "lock": S.plan[meal][i].lock=!S.plan[meal][i].lock; save.plan(); break;
    case "skip": { const d=S.plan[meal][i]; d.skip=!d.skip; if(d.skip) d.lock=false; save.plan(); break; }
    case "open": openRecipe(id,meal,el.dataset.i); return;
    case "puton": { const k=+document.getElementById("puton").value; const mm=el.dataset.meal; S.plan[mm][k]={r:id,lock:true,skip:false}; save.plan(); closeSheet(); toast("Added and locked."); return; }
    case "hide": { const h=S.settings.hidden||[]; S.settings.hidden = h.includes(id)?h.filter(x=>x!==id):[...h,id]; save.settings(); closeSheet(); return; }
    case "unhide": S.settings.hidden=(S.settings.hidden||[]).filter(x=>x!==id); save.settings(); break;
    case "fav": { const f=S.settings.fav||[]; S.settings.fav=f.includes(id)?f.filter(x=>x!==id):[...f,id]; save.settings(); break; }
    case "filter": ui.filter=el.dataset.k; render(); break;
    case "newrecipe": openNewRecipe(); return;
    case "delrecipe": if(armedBefore==="delr:"+id){ ui.armed=null; save.recipe(id,null); closeSheet(); toast("Recipe deleted."); } else { ui.armed="delr:"+id; openRecipe(id); } return;
    case "need": { const on=!S.trip.need[id]; delete S.trip.have[id]; if(on) S.trip.need[id]=1; else delete S.trip.need[id]; save.trip(); break; }
    case "have": { const on=!S.trip.have[id]; delete S.trip.need[id]; if(on) S.trip.have[id]=1; else delete S.trip.have[id]; save.trip(); break; }
    case "skipevery": { if(S.trip.have[id]) delete S.trip.have[id]; else S.trip.have[id]=1; save.trip(); break; }
    case "check": { const k=el.dataset.k; if(S.trip.checked[k]) delete S.trip.checked[k]; else S.trip.checked[k]=1; save.trip(); break; }
    case "qty": { const k=el.dataset.k; const row=buildList().list.find(x=>x.key===k); if(!row) break;
      const stepv = row.unit==="lb"||row.unit==="cup"?0.25: row.unit==="dozen"?0.5:1;
      S.trip.qty[k]=Math.max(0,Math.round((row.qty+stepv*(+el.dataset.d))*100)/100); save.trip(); break; }
    case "keep": { if(S.trip.keep[id]) delete S.trip.keep[id]; else S.trip.keep[id]=1; save.trip(); break; }
    case "finish": if(armedBefore==="finish"){ ui.armed=null; finishTrip(ui.store); } else { ui.armed="finish"; render(); } break;
    case "fresh": if(armedBefore==="fresh"){ ui.armed=null; S.trip=emptyTrip(); save.trip(); toast("List cleared. It now shows everything for this week's meals and staples."); } else { ui.armed="fresh"; render(); } break;
    case "store": setStoreView(id); ui.armed=null; render(); break;
    case "delstore": if(armedBefore==="delstore:"+id){ ui.armed=null; const st=S.settings; st.stores=st.stores.filter(x=>x.id!==id); if(st.defStore===id) st.defStore=st.stores[0]?st.stores[0].id:""; save.settings(); toast("Store removed. Its items moved to "+storeName(defaultStore())+"."); } else { ui.armed="delstore:"+id; render(); } break;
    case "copy": copyList(); break;
    case "starter": STARTER_STAPLES.forEach(([name,qty,unit,sec,every,snack,store])=>save.staple(uid(),{name,qty,unit,sec,every:!!every,snack:!!snack,store:validStore(store)||S.settings.defStore,hist:[]})); toast("Added "+STARTER_STAPLES.length+" starter staples. Edit them under Household."); break;
    case "gohome": tab="home"; render(); setTimeout(()=>document.getElementById("bulk")?.focus(),50); break;
    case "bulk": { const ta=document.getElementById("bulk"); const snack=document.getElementById("bulk-snack").checked; const lines=ta.value.split(/\n|,(?![^(]*\))/).map(parseLine).filter(Boolean);
      if(!lines.length){ toast("Type or paste at least one item."); break; }
      const bs=document.getElementById("bulk-store"); const store=bs?bs.value:defaultStore(); lines.forEach(x=>save.staple(uid(),{...x,store,every:false,snack,hist:[]})); ta.value=""; toast("Added "+lines.length+" staple"+(lines.length>1?"s":"")+"."); break; }
    case "editstaple": ui.editStaple=id; render(); break;
    case "canceledit": ui.editStaple=null; render(); break;
    case "delstaple": if(armedBefore==="del:"+id){ ui.armed=null; ui.editStaple=null; save.staple(id,null); toast("Staple deleted."); } else { ui.armed="del:"+id; render(); } break;
    case "unavoid": S.settings.avoid.splice(i,1); save.settings(); break;
    case "step": { const k=el.dataset.k, d=+el.dataset.d; const st=S.settings;
      if(k==="servings") st.servings=Math.min(20,Math.max(2,st.servings+d));
      if(k==="maxIng") st.maxIng=Math.min(12,Math.max(3,st.maxIng+d));
      if(k==="maxActive") st.maxActive=Math.min(90,Math.max(10,st.maxActive+d*5));
      if(k.startsWith("mix.")){ const s=k.slice(4); st.mix[s]=Math.min(7,Math.max(0,st.mix[s]+d)); }
      save.settings(); break; }
    default: render();
  }
});
document.addEventListener("change",e=>{
  const el=e.target; const act=el.dataset&&el.dataset.act;
  if(act==="prep"){ if(el.checked) S.prep[el.dataset.id]=1; else delete S.prep[el.dataset.id]; save.prep(); }
  if(act==="bfast"){ S.settings.breakfasts=el.checked; save.settings(); }
  if(act==="startday"){ S.settings.start=+el.value; save.settings(); }
  if(act==="movestore"){ const to=el.value, sid=el.dataset.staple, xid=el.dataset.extra;
    if(sid && S.staples[sid]){ save.staple(sid,{...clone(S.staples[sid]),store:to}); }
    else { S.settings.itemStore={...(S.settings.itemStore||{}),[norm(el.dataset.name)]:to}; save.settings();
      if(xid){ S.trip.extras=(S.trip.extras||[]).map(x=>x.id===xid?{...x,store:to}:x); save.trip(); } }
    toast(el.dataset.name+" moved to "+storeName(to)+"."); }
  if(act==="defstore"){ S.settings.defStore=el.value; save.settings(); }
  if(act==="renamestore"){ const v=el.value.trim(); if(v){ S.settings.stores=S.settings.stores.map(x=>x.id===el.dataset.id?{...x,name:v}:x); save.settings(); } else render(); }
});
document.addEventListener("input",e=>{ if(e.target.id==="rq"){ ui.q=e.target.value; const pos=e.target.selectionStart; render(); const n=document.getElementById("rq"); n.focus(); n.setSelectionRange(pos,pos); }});
document.addEventListener("submit",e=>{
  e.preventDefault(); const f=e.target.dataset.form;
  if(f==="extra"){ const inp=document.getElementById("extra-in"); const x=parseLine(inp.value); if(!x) return;
    const st=Object.entries(S.staples).find(([id,s])=>norm(s.name)===norm(x.name));
    if(st && !/^\d/.test(inp.value.trim())){ if(st[1].every) delete S.trip.have[st[0]]; else { S.trip.need[st[0]]=1; delete S.trip.have[st[0]]; } save.trip(); toast(st[1].name+" added at the usual amount."); }
    else { const ex={id:uid(),...x}; if(validStore(ui.store)) ex.store=ui.store; S.trip.extras=[...(S.trip.extras||[]),ex]; save.trip(); }
    inp.value=""; setTimeout(()=>document.getElementById("extra-in")?.focus(),0); }
  if(f==="store"){ const inp=document.getElementById("store-in"); const n=inp.value.trim(); if(!n) return;
    if(stores().some(x=>x.name.toLowerCase()===n.toLowerCase())){ toast(n+" is already on your list."); return; }
    S.settings.stores=[...stores(),{id:"s"+uid(),name:n}]; if(!validStore(S.settings.defStore)) S.settings.defStore=S.settings.stores[0].id; save.settings(); }
  if(f==="avoid"){ const inp=document.getElementById("avoid-in"); const items=inp.value.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);
    if(items.length){ S.settings.avoid=[...new Set([...(S.settings.avoid||[]),...items])]; save.settings(); } }
  if(f==="staple"){ const id=ui.editStaple; const s=clone(S.staples[id]); if(!s) return;
    s.name=document.getElementById("st-name").value.trim()||s.name; s.qty=parseFloat(document.getElementById("st-qty").value)||s.qty;
    s.unit=document.getElementById("st-unit").value; s.sec=document.getElementById("st-sec").value;
    const ss=document.getElementById("st-store"); if(ss) s.store=ss.value;
    s.every=document.getElementById("st-every").checked; s.snack=document.getElementById("st-snack").checked;
    ui.editStaple=null; save.staple(id,s); toast("Saved."); }
  if(f==="recipe"){
    const name=document.getElementById("nr-name").value.trim(); const ings=document.getElementById("nr-ing").value.split("\n").map(parseLine).filter(Boolean);
    if(!name||!ings.length){ toast("Add a name and at least one ingredient."); return; }
    const basics=/^(salt|pepper|olive oil|oil|butter|garlic powder|.*seasoning|.*powder|dried .*)$/i;
    const r={n:name,m:document.getElementById("nr-meal").value,s:document.getElementById("nr-starch").value,a:+document.getElementById("nr-a").value||20,
      t:+document.getElementById("nr-a").value||20,p:+document.getElementById("nr-p").value||0,how:"Family recipe",
      i:ings.map(x=>[x.qty,x.unit,x.name,basics.test(x.name)?"X":x.sec]),st:document.getElementById("nr-steps").value.split("\n").map(s=>s.trim()).filter(Boolean),
      pre:document.getElementById("nr-pre").value.trim()};
    save.recipe("r"+uid(),r); closeSheet(); toast("Recipe saved."); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

function copyList(){
  const {list}=buildList();
  const ids = ui.store==="all" ? stores().map(s=>s.id) : [ui.store];
  const block=items=>{ const groups={}; items.forEach(x=>(groups[x.sec]=groups[x.sec]||[]).push(x));
    return SECTION_ORDER.filter(k=>groups[k]).map(k=>SECTIONS[k].toUpperCase()+"\n"+groups[k].map(x=>"☐ "+fmtQty(x.qty)+unitLabel(x.unit,x.qty)+" "+x.name).join("\n")).join("\n\n"); };
  const txt=ids.map(id=>{ const items=list.filter(x=>!x.done&&x.store===id); return items.length ? "== "+storeName(id).toUpperCase()+" ==\n"+block(items) : ""; }).filter(Boolean).join("\n\n");
  if(!txt){ toast("Nothing left to buy."); return; }
  const fallback=()=>{ document.getElementById("sheet-root").innerHTML=`<div class="scrim" data-act="close"><div class="sheet"><div class="row between"><h2>Copy this list</h2><button class="icon-btn" data-act="close" aria-label="Close">×</button></div><textarea id="copybox" style="min-height:50vh">${esc(txt)}</textarea></div></div>`; const t=document.getElementById("copybox"); t.focus(); t.select(); };
  try{ navigator.clipboard.writeText(txt).then(()=>toast("List copied. Paste it into Notes or a text."),fallback); }catch(e){ fallback(); }
}

render();
Store.init();
</script>
